<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>vinsurgo 毎日投稿プロンプト</title>
  <style>
    :root{--ink:#111827;--sub:#5f6878;--line:#d9dde5;--paper:#fff;--soft:#f5f7fb;--blue:#2444a5;--ok:#08775b}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.35}
    main{width:min(1180px,calc(100% - 24px));margin:12px auto 28px}.hero,.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px rgba(20,30,55,.045)}
    .hero{padding:15px 18px}.hero-top,.batch-row,.status-row,.mode-options{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.hero-top{justify-content:space-between}.hero h1{margin:0;font-family:Georgia,serif;font-size:28px}.batch-row{margin-top:9px}
    .today,.status-pill{display:inline-flex;gap:5px;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750}.today{border:1px solid var(--line);background:#fff;color:var(--sub)}.status-row{margin-top:8px}.status-pill{background:#eef3ff;color:#263c81}.status-pill.error{background:#fff0ee;color:#b42318}.status-retry{padding:5px 9px;background:#fff;color:#b42318;border:1px solid #b42318}.status-retry[hidden]{display:none}
    button{border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.06)}button:disabled{cursor:not-allowed;opacity:.45;filter:none}.new-batch,.id-restore button,.mode-panel button{background:#fff;color:var(--blue);border:1px solid var(--blue)}
    .id-restore{display:flex;gap:7px;align-items:center;min-width:min(430px,100%)}.id-restore input,.mode-panel input{min-width:0;flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,monospace;background:#fff}.id-status{min-height:0;color:var(--ok);font-size:12px;font-weight:700}.mode-panel{margin-top:8px}.mode-options{font-size:12px}.mode-options label{font-weight:800}.mode-target{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:7px}.mode-target[hidden]{display:none}
    h2{margin:11px 2px 6px;font-size:14px;color:#39445a}.prompt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.core-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{width:100%;min-height:58px;padding:9px 11px;text-align:left;white-space:normal;display:flex;flex-direction:column;justify-content:center;gap:2px}.tile strong{font-size:13px}.tile small{font-size:11px;font-weight:650;opacity:.83}.tile .copy-state{font-size:10px;opacity:.75}.tile.copied{background:var(--ok)}
    .thumbnail-panel{grid-column:1/-1;display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:7px}.thumbnail-panel .image-prompt{grid-row:span 2;background:#101b36}.rename{background:#fff;color:var(--blue);border:1px solid var(--blue);min-height:58px}.rename.copied{background:#e7f6f0;color:var(--ok);border-color:var(--ok)}
    .free-talk-row{margin-top:7px}.free-talk-row .tile{background:#7a4d28}.free-talk-row .tile.copied{background:var(--ok)}
    #translations{grid-template-columns:repeat(2,minmax(0,1fr))}.country-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:7px;border:1px solid var(--line);border-radius:12px;background:#fff}.country-pair>[data-card]{min-width:0}
    .finish{margin-top:11px;padding:9px 12px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.path{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all}#master-file-label,#inbox-path{display:none}
    @media(max-width:820px){main{width:min(100% - 16px,680px)}.prompt-grid,.core-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#translations{grid-template-columns:1fr}.thumbnail-panel{grid-template-columns:repeat(2,minmax(0,1fr))}.thumbnail-panel .image-prompt{grid-column:1/-1;grid-row:auto}.id-restore{min-width:100%}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="hero-top"><h1>vinsurgo daily desk</h1><button class="new-batch" id="new-batch" type="button">新しい在庫</button></div>
    <div class="batch-row"><span class="today"><span id="today"></span></span><span class="today">ID：<span id="batch-id"></span></span><div class="id-restore"><input id="manual-batch-id" type="text" inputmode="text" autocomplete="off" list="batch-id-history" placeholder="在庫IDまたは末尾4文字"><datalist id="batch-id-history"></datalist><button id="restore-batch-id" type="button">戻す</button></div></div><div class="id-status" id="id-status" aria-live="polite"></div>
    <div class="status-row"><span class="status-pill">プロンプト版：<span id="prompt-version"></span></span><span class="status-pill">最終改善：<span id="prompt-updated"></span></span><span class="status-pill" id="catalog-status">公開記事一覧：取得中</span><button class="status-retry" id="catalog-retry" type="button" hidden>公開記事一覧を再取得</button><span class="status-pill">最新分析：<span id="latest-report">未作成</span></span></div>
    <div class="mode-panel">
      <div class="mode-options"><label><input type="radio" name="desk-mode" value="new" checked> 新規記事を作る</label><label><input type="radio" name="desk-mode" value="repair"> 既存記事を改善する</label></div>
      <div class="mode-target" id="repair-target" hidden><input id="repair-key" list="repair-candidates" placeholder="translationKey または公開URL"><datalist id="repair-candidates"></datalist><button id="apply-repair-target" type="button">改善対象を設定</button></div>
      <div class="id-status" id="repair-status" aria-live="polite"></div>
    </div>
  </section>

  <h2>1–3　基準記事</h2>
  <div class="prompt-grid core-grid"><div id="master"></div><div id="audit"></div><div id="reaudit"></div></div>
  <div class="free-talk-row" id="free-talk"></div>

  <h2>4–19　8カ国×2段階（2言語ドラフト → 2言語校閲・最終MD）</h2>
  <div id="translations" class="prompt-grid"></div>

  <h2>20　共通サムネイル</h2>
  <div id="thumbnails" class="prompt-grid"></div>

  <section class="panel finish"><strong>25ファイル保存 → 在庫追加.command</strong><span>完成在庫は毎日09:00に8カ国・16版を一括公開</span><span id="master-file-label"></span><span id="inbox-path"></span></section>
</main>
<script>
const PROMPT_VERSION='2026.09.04-one-point.1';
const PROMPT_UPDATED='2026-09-04';
const CATALOG_URLS=location.protocol==='file:'
 ? ['https://vinsurgo.com/editorial-catalog.json']
 : [new URL('./editorial-catalog.json',location.href).href,'https://vinsurgo.com/editorial-catalog.json'];
let catalog=[];
let catalogReady=false;
let analyticsState={reportDate:null,promptReviewRequired:false};
let deskMode='new';
let repairTarget=null;
const countries=[
 {code:'in',name:'インド',place:'India',langs:[['en-IN','English for India'],['hi-IN','natural Hindi']]},
 {code:'id',name:'インドネシア',place:'Indonesia',langs:[['id-ID','natural Indonesian'],['en-ID','English for Indonesia']]},
 {code:'my',name:'マレーシア',place:'Malaysia',langs:[['ms-MY','natural Malay'],['en-MY','English for Malaysia']]},
 {code:'vn',name:'ベトナム',place:'Vietnam',langs:[['vi-VN','natural Vietnamese'],['en-VN','English for Vietnam']]},
 {code:'sg',name:'シンガポール',place:'Singapore',langs:[['en-SG','English for Singapore'],['zh-Hans-SG','natural Simplified Chinese for Singapore']]},
 {code:'ph',name:'フィリピン',place:'the Philippines',langs:[['en-PH','English for the Philippines'],['fil-PH','natural Filipino']]},
 {code:'ng',name:'ナイジェリア',place:'Nigeria',langs:[['en-NG','English for Nigeria'],['ha-NG','natural Hausa']]},
 {code:'ke',name:'ケニア',place:'Kenya',langs:[['en-KE','English for Kenya'],['sw-KE','natural Swahili']]}
];
function jstNow(){const now=new Date();const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);return{day,hh:parts.find(x=>x.type==='hour').value,mm:parts.find(x=>x.type==='minute').value}}
let today=jstNow().day;
function createBatchId(){const now=jstNow();today=now.day;return `${now.day}-${now.hh}${now.mm}-${crypto.getRandomValues(new Uint16Array(1))[0].toString(36).padStart(4,'0').slice(-4)}`}
function hashBatchId(){const value=new URLSearchParams(location.hash.slice(1)).get('batch');return /^\d{4}-\d{2}-\d{2}-\d{4}-[a-z0-9]{4}$/.test(value||'')?value:null}
let batchId=hashBatchId()||createBatchId();
const historyKey='vinsurgo-batch-id-history-v1';
function batchHistory(){try{return JSON.parse(localStorage.getItem(historyKey)||'[]').filter(value=>/^\d{4}-\d{2}-\d{2}-\d{4}-[a-z0-9]{4}$/.test(value))}catch{return []}}
function rememberBatchId(value){const values=[value,...batchHistory().filter(item=>item!==value)].slice(0,50);localStorage.setItem(historyKey,JSON.stringify(values));const list=document.querySelector('#batch-id-history');list.replaceChildren(...values.map(item=>{const option=document.createElement('option');option.value=item;return option}))}
function progressKey(){return `vinsurgo-daily-progress-v2:${batchId}`}
function copiedCards(){try{return new Set(JSON.parse(localStorage.getItem(progressKey())||'[]'))}catch{return new Set()}}
function rememberCopied(id){const values=copiedCards();values.add(id);localStorage.setItem(progressKey(),JSON.stringify([...values]))}
function setBatchId(next){batchId=next;rememberBatchId(next);history.replaceState(null,'',`#batch=${encodeURIComponent(batchId)}`);document.querySelector('#today').textContent=today;document.querySelector('#batch-id').textContent=batchId;document.querySelector('#manual-batch-id').value='';document.querySelector('#master-file-label').textContent=`${batchId}-master.md`;document.querySelector('#inbox-path').textContent=`/Users/kmacmini/Documents/Codex/2026-08-22/github-plugin-github-openai-curated-remote/Vinsurgo/work/publication-queue/ready/${batchId}`;render()}
document.querySelector('#new-batch').onclick=()=>setBatchId(createBatchId());
document.querySelector('#restore-batch-id').onclick=()=>{const input=document.querySelector('#manual-batch-id');const typed=input.value.trim().toLowerCase();const status=document.querySelector('#id-status');let value=typed;if(/^[a-z0-9]{4}$/.test(typed)){const matches=batchHistory().filter(item=>item.endsWith(`-${typed}`));if(matches.length===1)value=matches[0];else if(matches.length>1){status.textContent='同じ末尾4文字の履歴が複数あります。候補から完全な在庫IDを選んでください。';status.style.color='#b42318';return}else{status.textContent='この端末の履歴にない末尾4文字です。完全な在庫IDを貼り付けてください。';status.style.color='#b42318';return}}if(!/^\d{4}-\d{2}-\d{2}-\d{4}-[a-z0-9]{4}$/.test(value)){status.textContent='完全な在庫ID、またはこの端末で作ったIDの末尾4文字を入力してください。';status.style.color='#b42318';return}setBatchId(value);status.textContent=`在庫IDを ${value} に戻しました。`;status.style.color='var(--ok)'};
async function writeClipboard(value){try{await navigator.clipboard.writeText(value)}catch{const area=document.createElement('textarea');area.value=value;area.setAttribute('aria-hidden','true');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}}
function markCopied(button,id){button.classList.add('copied');const state=button.querySelector('.copy-state');if(state)state.textContent='✓ コピー済み';if(id)rememberCopied(id)}
function card(id,title,meta,prompt,{requiresCatalog=false,requiresDraft=false}={}){const e=document.createElement('section');e.dataset.card=id;e.innerHTML=`<button class="tile" type="button"><strong>${title}</strong><small>${meta}</small><span class="copy-state">コピー</span></button>`;const button=e.querySelector('button');const copied=copiedCards();if(copied.has(id))markCopied(button);button.disabled=(requiresCatalog&&!catalogReady)||(requiresDraft&&!copied.has(id.replace('-final','-draft')));button.title=requiresCatalog&&!catalogReady?'公開記事一覧の取得完了後に使えます':requiresDraft&&button.disabled?'先にこの国の2言語ドラフトをコピーしてください':'';button.onclick=async()=>{await writeClipboard(prompt);markCopied(button,id);if(id.endsWith('-draft'))render()};return e}
function copyText(value,button){return async()=>{await writeClipboard(value);markCopied(button)}}
function thumbnailPanel(){const e=document.createElement('section');e.className='thumbnail-panel';const promptButton=document.createElement('button');promptButton.type='button';promptButton.className='tile image-prompt';promptButton.innerHTML='<strong>画像生成プロンプト</strong><small>完成記事から共通サムネを1枚作る</small><span class="copy-state">コピー</span>';promptButton.onclick=copyText(thumbnailPrompt(),promptButton);e.append(promptButton);for(const c of countries){const filename=`${batchId}-${c.code}-thumbnail.png`;const button=document.createElement('button');button.type='button';button.className='tile rename';button.innerHTML=`<strong>${c.name}</strong><small>${c.code} 保存名</small><span class="copy-state">コピー</span>`;button.onclick=copyText(filename,button);e.append(button)}return e}
function countryPair(c){const group=document.createElement('section');group.className='country-pair';group.setAttribute('aria-label',`${c.name}の2段階`);group.append(card(`translation-${c.code}-draft`,`${c.name}：2言語ドラフト`,c.langs.map(x=>x[0]).join(' / '),translationDraftPrompt(c)),card(`translation-${c.code}-final`,`${c.name}：2言語校閲・最終MD`,'直前の同国ドラフト限定',translationFinalPrompt(c),{requiresDraft:true}));return group}
function date(){return batchId}
function englishTopicCatalog(){const groups=new Map();for(const item of catalog){const current=groups.get(item.translationKey);if(!current||(item.language==='en'&&current.language!=='en')||(item.language==='en'&&item.country==='in'&&current.country!=='in'))groups.set(item.translationKey,item)}return[...groups.values()].filter(item=>item.language==='en')}
function catalogForPrompt(){return englishTopicCatalog().map(item=>JSON.stringify({translationKey:item.translationKey,title:item.title,subtitle:item.subtitle,description:item.description,audience:item.audience,outcome:item.outcome,summaryTags:item.summaryTags||[],primarySearchQuestion:item.primarySearchQuestion||'',searchIntent:item.searchIntent||'',contentType:item.contentType||'',bodyHeadings:(item.bodyHeadings||[]).slice(0,3),cluster:item.cluster||'',funnelStage:item.funnelStage||'',uniqueAngle:item.uniqueAngle||''})).join('\n')}
const onePointQuestions=['What should I say first after making a mistake at work?','How do I report a mistake before my manager notices?','How do I apologise after repeating the same mistake?','How can I rebuild trust after missing a deadline?','What action should follow an apology at work?','How can I ask a clarifying question before doing the wrong work?','How do I ask for help when I fear looking incompetent?','How do I return to work after being corrected in public?','How can I stop replaying a work mistake?','How do I separate one failure from my worth?','What is the first thing to change after feedback?','How can small promises rebuild trust?','How do I share bad news early and briefly?','How do I discuss delayed work without hiding it?','How do I start the first conversation after tension with a coworker?','How do I find the skill gap behind a work mistake?','How do I choose one skill instead of learning five?','How do I stop merely watching a course and start learning?','How do I turn learning into a small piece of work?','How can a beginner make a work sample without experience?','Do I need communication training or a different fix?','What should I check before learning conflict resolution?','How can I use Learning How to Learn for a work comeback?','What proof should I plan before choosing a Professional Certificate?','How can a beginner turn one useful skill into a small honest service?','How can I explain what I can do without exaggerating?','What proof should I make before taking a first paid request?','How do I improve a service after the first rejection?','How can I show learning when seeking a new role at work?','How do I choose one next earning option after a setback?'];
function pagePrefix(item){const primary=(item.country==='in'&&item.language==='en')||(item.country==='id'&&item.language==='id')||(item.country==='my'&&item.language==='ms')||(item.country==='vn'&&item.language==='vi')||(item.country==='sg'&&item.language==='en')||(item.country==='ph'&&item.language==='fil')||(item.country==='ng'&&item.language==='en')||(item.country==='ke'&&item.language==='sw');return primary?`/${item.country}`:`/${item.country}/${item.language}`}
function repairPromptTarget(){if(!repairTarget)return 'No valid repair target has been selected.';return `REPAIR_TARGET:\ntranslationKey: ${repairTarget.translationKey}\nslug: ${repairTarget.slug}\npublic URL: https://vinsurgo.com${pagePrefix(repairTarget)}/${repairTarget.slug}/\ncurrent title: ${repairTarget.title}\ncurrent subtitle: ${repairTarget.subtitle}\ncurrent audience: ${repairTarget.audience}\ncurrent outcome: ${repairTarget.outcome}`}
function masterPrompt(){const isRepair=deskMode==='repair';const task=isRepair?`Improve the existing vinsurgo article below. Read its public URL first. Keep its translationKey and ASCII slug, and update the same article rather than creating a new URL.\n\n${repairPromptTarget()}`:`Write one new English master article for vinsurgo's fixed 90-day focus: Workplace Comeback: Learn, Rebuild, and Create Your Next Earning Option. Serve one reader who made a mistake at work, lost confidence, does not know what to learn next, and needs a truthful path toward restored trust, one useful skill, visible proof, and a next work or small-income option. Coursera is not the topic. It is an optional practical choice only when structured learning genuinely solves the reader's problem.`;const novelty=isRepair?`Use the catalogue to remove unclear writing, repeated claims, weak search intent, poor empathy and generic examples without changing the article's core purpose or URL.`:`Choose the topic in this strict order: (a) an approved real GSC question inside the fixed focus, if one is supplied in the approved analytics state; (b) a different search intent that deepens an article ranking 4–20, if explicitly approved; (c) a missing reader stage visible in the public catalogue; then (d) one of the 30 seed questions below that is not semantically duplicated. Sparse data is not proof of search demand. Describe an unmeasured topic only as a specific question a reader would naturally ask.`;return `${task}

CREATION_AND_FACT_CHECK_DATE: ${today}
BATCH_ID: ${date()}

Use this English-only catalogue as the source of truth for duplication checks. Do not claim that you inspected other chats.

EXISTING_ENGLISH_TOPICS:
${catalogForPrompt()}

APPROVED_ANALYTICS_STATE:
${JSON.stringify(analyticsState)}

SEED_QUESTIONS_IF_HIGHER_PRIORITIES_ARE_UNAVAILABLE:
${onePointQuestions.map((question,index)=>`${index+1}. ${question}`).join('\n')}

${novelty}

Reject an apparent new topic when its reader state, search intent, central conclusion, emotional scene, three-part logic or reader outcome overlaps an existing item. Identify one exact question and answer it directly. Give the article one memorable human insight rather than a list of tips. Use one concrete opening scene and let the meaning deepen through the article. Write in clear English that a secondary-school student can understand. Address one reader as “you”, keep one main idea per sentence, and prefer short paragraphs. Never invent facts; verify current claims with current primary sources. Use the shortest length that fully answers the question; about 900–1,400 words is a guide, not a pass/fail threshold. Never pad to reach a word count.

Required public structure:
1. A clear title that immediately tells the topic
2. A simple but specific subtitle
3. Author, publication date, update date, fact-check date and reading time
4. A 16:9 thumbnail description, not an image
5. “This article is for you if”
6. “By the end”
7. A conversational empathy heading that sounds like you and the reader are speaking together
8. A short conclusion pop with collaborative “let’s” bullets
9. Exactly three numbered body sections
10. A connecting summary after the three sections
11. “Move closer to the person you want to become” with collaborative “let’s” bullets, never homework language
12. A Coursera guide-card placeholder only when courseFit is indirect or direct; omit Coursera entirely when courseFit is none
13. Same-country and same-language previous/next navigation placeholders

Do not translate, generate images, build or deploy.

OUTPUT RULE — ABSOLUTE:
Return only the complete public article. Do all planning and checking silently. Do not output notes, sources, audits, scores, PASS/HOLD, explanations, apologies, introductions about the task or any text outside the article.`}
function freeTalkPrompt(){return `Write one new English voice article for vinsurgo. Friday is preferred, though it may be used on another day. It is not filler. Its job is to let one reader feel, “Now I understand what kind of person is writing this,” or, “I never thought about it that way.”

CREATION_AND_FACT_CHECK_DATE: ${today}
BATCH_ID: ${date()}

Use the catalogue below to avoid repeating any published question, scene, lesson, emotional turn or conclusion:
${catalogForPrompt()}

Stay inside the workplace-comeback focus. Choose one ordinary observation, small contradiction, private embarrassment, surprising thought or gentle absurdity that carries an original view of failure, recovery, relearning or honest earning. Do not turn the article into a lesson plan, productivity list or Coursera pitch. Reject semantic overlap using reader state, search intent, central conclusion, emotional scene, logic and reader outcome—not title alone.

Make the author's emotional point of view visible without inventing personal experiences. The reader and writer must stand on the same side. Never laugh at the reader. Use humour only to lower tension, make an idea memorable or bridge into understanding. Default to warm lightness or observational humour; avoid sarcasm, shame, guilt, stereotypes, identity jokes and forced slang. Build the emotional movement as empathy, reassurance, clarity, hope, then a light smile or surprise where it truly helps. The structure may be freer than a standard article, but it must still have a clear beginning, turn and landing.

Choose one specific question a reader would naturally ask and answer it naturally. Do not claim search demand unless approved measurement is supplied. Use secondary-school English, one idea per sentence, short paragraphs and concrete sensory scenes. Verify current factual claims with primary sources. Use only the length needed; about 900–1,300 words is a guide and must never cause padding.

Include the normal reader-facing metadata, “This article is for you if”, “By the end”, one conversational empathy heading, and a final “Move closer to the person you want to become” section. Use exactly three numbered sections only if they improve the story; otherwise use a clear free-flowing structure. Add a Coursera placeholder only if structured learning follows naturally from the story. Set contentType to free-talk later when the Markdown file is created.

OUTPUT RULE — ABSOLUTE:
Return only the complete public article. Do all planning and checking silently. Do not output notes, sources, audits, scores, PASS/HOLD, explanations, apologies or any text outside the article.`}
function auditPrompt(){return `Audit the draft immediately above. Use every checkbox in ARTICLE_AUDIT_CHECKLIST.md and WRITING_RULES.md.

Check especially:
- the central lesson is not a duplicate or paraphrase of an existing published vinsurgo article, a completed project chat, or anything already written in this chat;
- it stays focused on the one topic and reader promise selected for today;
- the title, subtitle and article body make one clear promise and fulfil it;
- each claim follows logically from the previous one, with no contradiction, hidden assumption or unsupported leap;
- factual and current claims are checked against current primary sources and accurately qualified;
- the three body sections add three different, necessary parts rather than repeating one point;
- every example directly supports the conclusion rather than decorating the article;
- the article gives the reader a useful new way to understand or act, not generic encouragement;
- no paragraph is filler, self-praise, process commentary or a disguised advertisement;
- one individual reader is addressed as “you”;
- the empathy heading creates a real “you and me” conversation;
- ordinary secondary-school-level English is used;
- spelling, grammar, punctuation and word choice are correct and consistent;
- specialist terms are explained with concrete images;
- a pillar-a article contains exactly three numbered body sections; a free-talk article keeps a clear beginning, turn and landing without being forced into a list;
- the connecting summary logically joins all three;
- facts are supported and claims are not exaggerated;
- the article does not become another generic habit, consistency or course-choice article;
- all required public parts for the selected content type are present.

For every failed item, repair the article rather than describing the problem. Repeat the audit and repair silently until every requirement passes. Do not translate or generate files yet.

OUTPUT RULE — ABSOLUTE:
Return only the entire revised public article. Do not show the audit table, checklist, item IDs, results, scores, PASS/HOLD text, evidence, citations ledger, reasoning, change summary, preface, afterword, completion marker or any chat commentary. Even if no repair was needed, return only the complete article. The first visible line must be the article title and the last visible line must be part of the public article.`}
function reauditPrompt(){return `Strictly recheck the latest complete article against every rule in ARTICLE_AUDIT_CHECKLIST.md and WRITING_RULES.md.

If even one requirement is weak, contradictory, duplicated, unsupported, too difficult, impersonal or missing, repair the complete article and check it again silently. Repeat internally until it passes. Never accept it merely because an earlier response did.

When every rule passes, create one downloadable UTF-8 Markdown file named exactly:
${date()}-master.md

The file must contain the approved complete article with YAML frontmatter and no chat commentary, evidence ledger, audit table, code fence, FILE_BEGIN marker or FILE_END marker. Required frontmatter fields: contentId, operation: ${deskMode==='repair'?'repair':'new'}, contentType (pillar-a for a normal article, free-talk for a voice article), title, subtitle, description, slug, category, thumbnailAlt, audience, outcome, summaryTags (3–6 short concepts), primarySearchQuestion, searchIntent, readerState, exactQuestion, uniqueAngle, cluster, funnelStage, courseFit, readTime and translationKey. cluster must be one of immediate-repair, emotional-recovery, trust-rebuild, skill-rebuild, proof-and-income, coursera-choice. funnelStage must be one of urgent, recover, rebuild, learn, earn, choose-course. courseFit must be none, indirect or direct. Use an ASCII kebab-case slug. A Coursera placeholder is forbidden when courseFit is none and allowed only when courseFit is indirect or direct.

OUTPUT RULE — ABSOLUTE:
Output only the downloadable ${date()}-master.md attachment. Do not print the article in chat. Do not output an audit table, checklist, failure list, score, PASS/HOLD text, completion marker, preface, afterword, explanation, apology or any other chat commentary. If the interface forces a text message beside the attachment, use only the filename: ${date()}-master.md.`}
function translationDraftPrompt(c){return `Create exactly two DRAFT editions for ${c.place} from the latest approved English master in this same chat.
${c.langs.map(l=>`- ${l[0]}: ${l[1]}`).join('\n')}

BATCH_ID: ${date()}
COUNTRY: ${c.code}
LOCALES: ${c.langs.map(l=>l[0]).join(', ')}
STAGE: bilingual-draft

The approved English master is the only source. Never use another country's translation as a source. Preserve meaning, verified facts, numbers, dates, names, URLs, negations, conditions, limits and conclusion. Localise the title, empathy scene, concrete examples, transitions and conclusion in both languages. The regional English must not copy another country edition or merely replace a country name. Do not add unverified prices, salaries, jobs, laws, programmes, payment methods or Coursera availability.

function translationFinalPrompt(c){const files=c.langs.map(l=>`${date()}-${c.code}-${l[0]}.md`).join('\n');return `Proofread and finalise exactly the two ${c.place} drafts immediately above.

BATCH_ID: ${date()}
COUNTRY: ${c.code}
LOCALES: ${c.langs.map(l=>l[0]).join(', ')}

Read only (1) the approved English master in this chat and (2) the immediately preceding two drafts for country ${c.code}. Never use another country's translation as the source. If the immediately preceding response is not the two drafts for this exact batch ID, country and locales, stop and say only: SOURCE_MISMATCH.

First, silently audit meaning: numbers, dates, proper names, URLs, negations, conditions, limits, conclusion and every Coursera statement. Then silently audit localisation and search intent: natural word order, translation-like phrasing, accidental language mixing, secondary-school vocabulary, title/body agreement, direct answer to the reader's question, genuine localisation rather than country-name replacement, no invented local facts, and a natural one-reader “you” and “let's” voice. Fix every problem before finalising. Preserve the freer structure for contentType free-talk; do not force the pillar-a three-section rule onto a voice article. A Coursera placeholder is forbidden when courseFit is none and allowed only when courseFit is indirect or direct.

Create two separate downloadable UTF-8 Markdown files named exactly:
${files}

function thumbnailPrompt(){return `Create exactly one new 16:9 landscape thumbnail from the latest approved master article in this chat. Read the full article first. Use the article—not its translations—as the only content source. This one image will be shared by all 16 language editions.

Build one clear visual metaphor from the article's specific human tension, turning point and final feeling. The image must still be understandable at small thumbnail size. It must feel made for this article, not like a general success, education or career image.

Use the vinsurgo visual language: a warm ivory background; deep navy, soft slate blue and muted golden light; a refined editorial illustration; restrained paper-grain or cut-paper texture; generous negative space; calm, hopeful emotion; and one unmistakable focal point. Keep the composition clean, premium and emotionally warm.

Use that visual language only. Do not copy the reference composition. Do not default to stairs, a winding path, an open door, a mountain, a sunrise, a bird or decorative plants. Use any of those only when the approved article itself uniquely requires it. Invent a fresh scene, camera distance, action, central symbol and arrangement for today's article.

Show people only when the story benefits from them. If a person appears, make the person broadly inclusive and natural rather than tied to one country or stereotype. Use one continuous composition. No grid, panels, split screen, collage, comparison sheet or multiple options. No text, letters, numbers, logos, flags, brand marks, certificates, watermarks or transparent background.

Generate the image now. Output only the single image and nothing else.`}
function render(){const isRepair=deskMode==='repair';document.querySelector('#master').replaceChildren(card('master',isRepair?'既存記事を改善':'1　一点突破記事を生成',isRepair?`${repairTarget?.translationKey||'対象未設定'}｜URL維持`:'仕事のつまずき→学び直し→次の選択肢',masterPrompt(),{requiresCatalog:true}));document.querySelector('#audit').replaceChildren(card('audit','2　内容監査・修正','本文だけ返す',auditPrompt()));document.querySelector('#reaudit').replaceChildren(card('reaudit','3　MDを出力','完成MDだけ返す',reauditPrompt()));const freeTalk=document.querySelector('#free-talk');freeTalk.replaceChildren();if(!isRepair)freeTalk.append(card('free-talk','voice記事を生成','金曜日優先｜一点突破テーマ内',freeTalkPrompt(),{requiresCatalog:true}));document.querySelector('#translations').replaceChildren(...countries.map(countryPair));document.querySelector('#thumbnails').replaceChildren(thumbnailPanel());const masterButton=document.querySelector('[data-card="master"] button');if(masterButton&&isRepair&&!repairTarget){masterButton.disabled=true;masterButton.title='改善対象を設定してください'}}
function normaliseTarget(value){return value.trim().replace(/^https:\/\/vinsurgo\.com\//,'').replace(/^\/+|\/+$/g,'')}
function selectRepairTarget(){const typed=normaliseTarget(document.querySelector('#repair-key').value);const matches=catalog.filter(item=>item.translationKey===typed||`${pagePrefix(item).slice(1)}/${item.slug}`===typed||`${item.country}/${item.slug}`===typed||item.slug===typed);const status=document.querySelector('#repair-status');if(!matches.length){repairTarget=null;status.textContent='一致する公開記事がありません。translationKeyまたは公開URLを確認してください。';status.style.color='#b42318';render();return}repairTarget=matches.find(item=>item.language==='en')||matches[0];status.textContent=`改善対象：${repairTarget.translationKey}｜${repairTarget.title}`;status.style.color='var(--ok)';render()}
document.querySelectorAll('input[name="desk-mode"]').forEach(input=>input.addEventListener('change',event=>{deskMode=event.target.value;document.querySelector('#repair-target').hidden=deskMode!=='repair';document.querySelector('#repair-status').textContent='';if(deskMode==='new')repairTarget=null;render()}));
document.querySelector('#apply-repair-target').onclick=selectRepairTarget;
async function fetchCatalogue(){const errors=[];for(const url of CATALOG_URLS){try{const response=await fetch(`${url}${url.includes('?')?'&':'?'}v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const payload=await response.json();if(!Array.isArray(payload.articles)||!payload.articles.length)throw new Error('記事一覧が空です');return payload}catch(error){errors.push(`${new URL(url,location.href).host||'ローカル'}: ${error.message}`)}}throw new Error(errors.join(' / '))}
async function loadCatalog(){const status=document.querySelector('#catalog-status'),retry=document.querySelector('#catalog-retry');retry.hidden=true;status.textContent='公開記事一覧：取得中';status.classList.remove('error');catalogReady=false;render();try{const payload=await fetchCatalogue();catalog=payload.articles;const topics=englishTopicCatalog();if(!topics.length)throw new Error('英語テーマ一覧が空です');catalogReady=true;status.textContent=`公開記事：${catalog.length}ページ／${topics.length}テーマ・取得済み`;const list=document.querySelector('#repair-candidates');list.replaceChildren(...topics.map(item=>{const option=document.createElement('option');option.value=item.translationKey;option.label=`${item.title} (${item.slug})`;return option}));render()}catch(error){catalog=[];catalogReady=false;status.textContent=`公開記事一覧：取得失敗（${error.message}）`;status.classList.add('error');retry.hidden=false;render()}}
async function loadLatestReport(){try{const response=await fetch(`https://hokorobi88room.github.io/Vinsurgo-preview/analytics-status.json?v=${Date.now()}`,{cache:'no-store'});if(response.ok){analyticsState=await response.json();document.querySelector('#latest-report').textContent=analyticsState.reportDate||'未作成';render()}}catch{}}
document.querySelector('#prompt-version').textContent=PROMPT_VERSION;
document.querySelector('#prompt-updated').textContent=PROMPT_UPDATED;

setBatchId(batchId);
loadCatalog();
loadLatestReport();
